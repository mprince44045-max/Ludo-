<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Ludo Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Ludo Game</h1>
        <div class="board">
            <div class="dice-area">
                <div id="dice" class="dice">🎲</div>
                <button id="roll-btn">Roll Dice</button>
                <p id="status">Dice roll karein!</p>
            </div>
            <div class="tokens-area">
                <div class="token red" id="token-1">1</div>
                <div class="token green" id="token-2">2</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
